# ===================================================
# CONFIGURAÇÕES EXCLUSIVAS DO AMBIENTE DE PRODUÇÃO
# ===================================================

# Conexão com o banco de Produção na VM externa (Injetado via Secrets)
spring.datasource.url=${POSTGRES_DB_URL}
spring.datasource.username=${POSTGRES_USER}
spring.datasource.password=${POSTGRES_PASSWORD}

# Configurações do driver e plataforma do Hibernate para o Postgres
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# Proteção máxima para o Tribunal: Apenas valida, nunca altera a estrutura da VM
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false