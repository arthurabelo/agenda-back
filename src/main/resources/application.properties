spring.application.name=agenda-telefonica
spring.config.import=optional:file:.env[.properties]
# Access configuration of database JDBC [cite: 296]
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/agenda_db}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driverClassName=org.postgresql.Driver

# Schema gerenciado por Flyway; Hibernate apenas valida
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Flyway - baseline em bases existentes (hom/prod já têm schema)
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0

springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.operations-sorter=alpha
springdoc.swagger-ui.tags-sorter=alpha
springdoc.swagger-ui.display-request-duration=true
spring.data.ldap.repositories.enabled=false
management.health.ldap.enabled=false

# Active Directory (LDAP)
ad.server.url=${AD_SERVER_URL}
ad.domain=${AD_DOMAIN}
ad.upn-suffix=${AD_UPN_SUFFIX}
ad.base-dn=${AD_BASE_DN}
ad.login-group=${AD_LOGIN_GROUP:}

# CORS - origens permitidas (apenas produção/homologação por padrão)
app.cors.allowed-origins=http://10.20.11.26,https://contatos-hom.tjpi.jus.br