apiVersion: apps/v1
kind: Deployment
metadata:
  name: agenda-back
  namespace: app-agenda
spec:
  replicas: 2
  selector:
    matchLabels:
      app: agenda-back
  template:
    metadata:
      labels:
        app: agenda-back
    spec:
      containers:
        - name: agenda-back
          image: registry.gitlab.com/SEU_GRUPO/agenda-back:latest
          ports:
            - containerPort: 8080

          envFrom:
            - configMapRef:
                name: agenda-back-config
            - secretRef:
                name: agenda-back-secret

          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"

          livenessProbe:
            httpGet:
              path: /actuator/health
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 10

          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 5